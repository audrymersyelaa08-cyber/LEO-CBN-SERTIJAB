<!DOCTYPE html>
<html>
<head>
    <title>Leo CBN Event</title>
    <style>
        body{
            font-family: Arial;
            text-align:center;
            margin-top:100px;
            background:#f5f5f5;
        }

        .card{
            background:white;
            padding:40px;
            max-width:500px;
            margin:auto;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="card">
    <h3>Kepada Yth.</h3>

    <h1 id="guest">Tamu Undangan</h1>

    <p>Leo Cosmo Bungo Nusantara Fellowship BBQ</p>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const nama = params.get("to");

if(nama){
    document.getElementById("guest").innerText =
    decodeURIComponent(nama);
}
</script>

</body>
</html>
